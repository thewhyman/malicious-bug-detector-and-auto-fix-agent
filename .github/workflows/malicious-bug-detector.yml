name: Malicious Bug Detector & Fixer Agent

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history to ensure proper branch tracking and git log checks
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Detector & Auto-Fixer
        id: detector
        run: |
          python scripts/detector.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # The SonarCloud scan step only runs if a branch was created and pushed.
      # The python script names the branch fix/issue-<number>.
      # We check out the branch and run the analysis.
      - name: Determine branch name and checkout
        if: success()
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          BRANCH_NAME="fix/issue-${ISSUE_NUMBER}"
          echo "Checking out $BRANCH_NAME for SonarCloud scan"
          git checkout $BRANCH_NAME

      - name: Run SonarCloud Scan
        id: sonar
        if: success()
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Flag Issue on Sonar Failure
        if: failure() && steps.sonar.outcome == 'failure'
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          BRANCH_NAME="fix/issue-${ISSUE_NUMBER}"
          echo "Fetching SonarCloud quality gate status for branch $BRANCH_NAME"
          
          # Fetch quality gate status from SonarCloud API
          SONAR_STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=thewhyman_malicious-bug-detector-and-auto-fix-agent&branch=${BRANCH_NAME}")
          echo "SonarCloud API response: $SONAR_STATUS"
          
          # Extract failed conditions using jq
          FAILED_CONDITIONS=$(echo "$SONAR_STATUS" | jq -r '.projectStatus.conditions[] | select(.status == "ERROR") | "- **\(.metricKey)**: \(.actualValue) (Threshold: \(.comparator) \(.errorThreshold))"')
          
          # Construct comment body
          echo "⚠️ **Security Scan Failed**: The SonarCloud static analysis failed on the generated fix branch." > comment_body.md
          echo "" >> comment_body.md
          echo "**SonarCloud Quality Gate Failures:**" >> comment_body.md
          echo "${FAILED_CONDITIONS:-*(Unable to retrieve detailed condition metrics or none found)*}" >> comment_body.md
          echo "" >> comment_body.md
          echo "You can view the full security report on the **[SonarCloud Dashboard](https://sonarcloud.io/dashboard?id=thewhyman_malicious-bug-detector-and-auto-fix-agent&branch=${BRANCH_NAME})**." >> comment_body.md
          echo "" >> comment_body.md
          echo "Pull Request creation has been blocked." >> comment_body.md
          
          gh issue comment $ISSUE_NUMBER -F comment_body.md
          gh issue edit $ISSUE_NUMBER --add-label "security-risk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: success()
        run: |
          gh pr create \
            --title "fix: Resolve issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}" \
            --body "Closes #${{ github.event.issue.number }}. This is an automated bug fix generated by the Google Managed Agent. Unit tests have been generated and successfully run on the runner. Static analysis has passed on SonarCloud." \
            --head "fix/issue-${{ github.event.issue.number }}" \
            --base "main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
