# SonarCloud Project Configuration Template
# Make sure to replace placeholders with your actual SonarCloud project details.

sonar.projectName=Malicious Bug Detector and Auto-Fix Agent
sonar.projectKey=malicious-bug-detector-and-auto-fix-agent
sonar.organization=YOUR_SONARCLOUD_ORGANIZATION_KEY
sonar.host.url=https://sonarcloud.io

# Path to source files (relative to root)
sonar.sources=.
sonar.exclusions=**/test_*.py,**/node_modules/**,**/tests/**

# Path to tests
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests/**
sonar.python.version=3
